[package]
name = "pas-hq-app"
version = "0.1.0"
edition = "2024"
autotests = false

[[test]]
name = "unit"
path = "tests/unit/main.rs"

[dependencies]
bcrypt = "0.19"
chrono = { version = "0.4", default-features = false, features = ["std"] }
jsonwebtoken = "9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-webpki", "chrono"] }
uuid = { version = "1", features = ["v4"] }
